<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expo Robótica & Tecnología</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilo personalizado -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Favicon Cyberpunk -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- Barra de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-warning d-flex align-items-center gap-2" href="{{ url_for('inicio') }}">
                <span>⚡</span> EXPO ROBÓTICA
            </a>
            <div class="navbar-nav ms-auto d-flex flex-row gap-3">
                <a class="nav-link text-white fw-semibold" href="{{ url_for('inicio') }}">🏠 Inicio</a>
                <a class="nav-link text-white fw-semibold" href="{{ url_for('galeria') }}">🖼️ Galería</a>
            </div>
        </div>
    </nav>

    <!-- Contenido principal -->
    <main class="flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <!-- Pie de página (Footer Tech) -->
    <footer class="py-4 mt-5 text-center text-light opacity-75 border-top border-secondary border-opacity-25" style="background: rgba(13, 17, 23, 0.95);">
        <div class="container">
            <p class="m-0 small">🤖 Muestra Anual de Robótica y Tecnología | Desarrollado con Flask & Python</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
